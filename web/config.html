<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 meteostanice - dashboard</title>
    <style>
        body{
            font-family: Roboto, Arial;
        }

        .dashboard{
            width: 400px;
            text-align: justify;
        }
        button{
            width: 10vw;
            height: 5vh;
            transition: 0.3s;
            background-color: green;
            color: pink;
        }
        button:hover{
            width: 20vw;
            height: 10vh;
            background-color: pink;
            color: red;
        }
        button:active{
            width: 100%;
            height: 100%;
            background-color: red;
            color: green;
            font-size: 200px;
        }

        input{
            width: 20vw;
            height: auto;
            transition: 0.3s;
        }

        input:focus{
            width: 100vw;
            height: 100vh;
            background-color: aqua;
            font-size: 100px;
        }
    </style>
    <script>

    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <h1>Konfigurační stránka</h1>
        <label for="zastavka">ID zastávky: </label><input type="text" id="zastavka"><button onclick="save()">Ulož</button><br>
        <label for="interval">Interval aktualizací: </label><input type="number" id="interval" min="5" placeholder="v sekundách" value="5"><button onclick="save()">Ulož</button><br>
    </div>
</body>
</html>
