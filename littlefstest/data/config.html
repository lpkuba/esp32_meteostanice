<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 meteostanice - dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zumer/snapdom/dist/snapdom.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body{
            font-family: Roboto, Arial;
        }

        .dashboard{
            width: 50%;
            text-align: justify;
            display: flex;
            align-items: left;
            justify-content: space-evenly;
            flex-direction: column;
        }
        button{
            width: 10vw;
            height: 5vh;
            transition: 0.3s;
            background-color: green;
            color: pink;
        }
        button:hover{
            background-color: pink;
            color: red;
        }
        button:active{
            background-color: red;
            color: green;
        }

        input{
            transition: 0.3s;
        }

        input:focus{
            background-color: aqua;
        }

        .dropdown{
           width: 200px;
           display: block;
        }
        .dropdown input{
            width: 100%;
        }
        .dropdown-content{
            background-color: lightblue;
            margin-top: 5px;
            position: fixed;
        }
        .dropdown-content .stops{
            text-align: left;
            padding: 5px 0 10px 5px;
            border: 1px solid gray;
            margin: 0;
            border-collapse: collapse;
            font-family: Bahnschrift;
            font-weight: bold;
            cursor: pointer;
        }
        .dropdown-content .stops:hover{
            background-color: lightcoral;
        }

        .dropdown-content .stops .lines{
            font-size: 10px;
            font-weight: lighter;
        }
    </style>
    <script>
        let stops = {};
        let stopsMap, stopsMappedArray, fuseStops, fetchOpt, fuse, selectedStop, updateIntervalId;
        selectedStop = {};
        selectedStop.uniqueName = "Vyber zastávku!";
        async function init(){
            let result = await fetch("https://lpkuba.github.io/stops.json");
            stops = await result.json();
            fuse = new Fuse(stops.stopGroups,{
                keys: [{name:'uniqueName', weight: 3}, {name:'stops.altIdosName', weight: 1}],
                threshold: 0.3,
                limit: 10
            });
        }
        function searchChanged(){
            console.log("search changed");
            let searchInput = document.getElementById("stopInput").value;
            if(searchInput != ""){
                document.getElementById("searchDropdown").hidden = false;
            }
            else{
                document.getElementById("searchDropdown").hidden = true;
            }
            let searchResult = fuse.search(searchInput).slice(0,10);
            console.log(searchResult);
            updateSearchList(searchResult);
        }
        
        function updateSearchList(list){
            document.getElementById("searchDropdown").textContent = "";
            selectedStop = list[0].item;
            document.getElementById("zastavka").value = selectedStop.cis;
            for (let i = 0; i < list.length; i++) {
                let linky = [];
                const element = list[i].item;
                let newStopElement = document.createElement("div");
                newStopElement.classList.add("stops");
                newStopElement.onclick = function() {updateSearchValue(element.uniqueName)};
                let stopName = document.createElement("span");
                stopName.innerHTML = element.uniqueName;
                let stopLines = document.createElement("span");
                stopLines.classList.add("lines");
                //nested foreache <3
                element.stops.forEach(nastupiste => {
                    nastupiste.lines.forEach(linka => {
                        if(!linky.includes(linka.name)){
                            linky.push(linka.name);
                        }
                    });
                });
                linky.forEach(text => {
                    stopLines.innerHTML += `${text} `;
                })
                newStopElement.appendChild(stopName);
                newStopElement.appendChild(document.createElement("br"));
                newStopElement.appendChild(stopLines);
                document.getElementById("searchDropdown").appendChild(newStopElement);
            }
        }
        
        function updateSearchValue(value){
            document.getElementById("stopInput").value = value;
            document.getElementById("searchDropdown").hidden = true;
            searchChanged();
        }

        function save(){
            let stopId = document.getElementById("zastavka").value;
            let interval = document.getElementById("interval").value;
            let ssid = document.getElementById("ssid").value;
            let pass = document.getElementById("pass").value;
            if(stopId == ""){
                document.getElementById("zastavka").style.backgroundColor = "red";
            }
            if(interval == ""){
                document.getElementById("interval").style.backgroundColor = "red";
            }
            /*if(ssid == ""){
                document.getElementById("ssid").style.backgroundColor = "red";
            }
            if(pass == ""){
                document.getElementById("pass").style.backgroundColor = "red";
            }*/
            fetch(`/update?id=${stopId.length > 0 ? stopId : 0}&interval=${interval.length > 0 ? interval : 10}${ssid.length > 0 ? "&ssid=" + ssid : ""}${pass.length > 0 ? "&pass=" + pass : ""}`);
        }

        function onUpdateText(element){
            element.style.backgroundColor = "";
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body onload="init()">
    <div class="dashboard">
        <h1>Konfigurační stránka</h1>
        <label for="zastavka">ID zastávky: </label><input type="text" id="zastavka" onchange="onUpdateText(this)"><br>
        <label for="interval">Interval aktualizací: </label><input type="number" id="interval" min="5" placeholder="v sekundách" value="5" onchange="onUpdateText(this)"><br>
        <label for="ssid">SSID 2.4GHz WiFi sítě: </label><input type="text" id="ssid" onchange="onUpdateText(this)"><br>
        <label for="pass">Heslo sítě </label><input type="password" id="pass" onchange="onUpdateText(this)"><br>
        <button onclick="save()">Ulož</button>
        <label for="stopInput">Zadej jméno hledané zastávky:</label>
        <div class="dropdown">
            <input type="text" id="stopInput" placeholder="název zastávky..." oninput="searchChanged()" style="display: block" autocomplete="off">
            <div class="dropdown-content" id="searchDropdown" hidden>
                <!--<div class="stops">
                    <span>Zastávka 1</span><br>
                    <span class="lines">placeholder</span>
                </div>
                <div class="stops">
                    <span>Zastávka 2</span><br>
                    <span class="lines">bus: 303, 344, 343, 408</span>
                </div>
                <div class="stops">
                    <span>Zastávka 3</span><br>
                    <span class="lines">bus: 303, 344, 343, 408</span>
                </div>-->
            </div>
        </div><br>
    </div>
</body>
</html>
